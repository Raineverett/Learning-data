<head>

<title>GEPT 中級單字快刷</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#222;--muted:#6b7280;--accent:#5b5bd6;--good:#16803a;--bad:#c23434;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:white;padding:24px 18px}header h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.9}
.wrap{max-width:900px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}button,select,input{font:inherit}
.tab,.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.tab{background:#ececf8}.tab.active{background:var(--accent);color:white}.btn{background:var(--accent);color:white}.btn.secondary{background:#eee;color:#222}.btn.good{background:var(--good)}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}label{font-size:13px;color:var(--muted)}select,input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}
.word{font-size:42px;font-weight:800;text-align:center;margin:28px 0 8px}.meaning{font-size:25px;text-align:center;margin:12px 0 26px}.hidden{filter:blur(10px);user-select:none}.center{text-align:center}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.options{display:grid;gap:10px;margin-top:18px}.option{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;text-align:left;cursor:pointer}.option.correct{border-color:var(--good);background:#ecfdf3}.option.wrong{border-color:var(--bad);background:#fff0f0}.stats{display:flex;gap:14px;justify-content:center;color:var(--muted);margin:12px 0}
.list{display:grid;gap:8px;max-height:65vh;overflow:auto}.item{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;align-items:center;background:white;border:1px solid var(--line);padding:11px;border-radius:10px}.item b{font-size:17px}.speak{border:0;background:#eee;border-radius:9px;padding:8px;cursor:pointer}
.feedback{min-height:28px;font-weight:700;text-align:center;margin-top:12px}.small{font-size:13px;color:var(--muted)}
@media(max-width:560px){header h1{font-size:24px}.word{font-size:34px}.item{grid-template-columns:1fr auto}.item span{grid-column:1/-1}}
</style></head>
<body><header><div class="wrap"><h1>GEPT 中級單字快刷</h1><p>共 900 個單字｜抽認卡、選擇題、拼字、完整單字表</p></div></header>
<div class="wrap">
<div class="tabs"><button class="tab active" data-tab="flash">抽認卡</button><button class="tab" data-tab="quiz">選擇題</button><button class="tab" data-tab="spell">拼字</button><button class="tab" data-tab="list">單字表</button></div>
<div class="controls card"><div><label>字母範圍<select id="letter"><option value="all">全部 A–Z</option></select></label></div><div><label>出題方向<select id="direction"><option value="en-zh">英文 → 中文</option><option value="zh-en">中文 → 英文</option></select></label></div><div><label>每回題數<select id="count"><option>10</option><option>20</option><option>30</option><option value="9999">全部</option></select></label></div><div style="display:flex;align-items:end"><button class="btn" onclick="restart()">重新開始</button></div></div>
<section id="flash" class="panel active"><div class="card center"><div class="stats" id="flashStats"></div><div class="word" id="flashQ"></div><div class="meaning hidden" id="flashA"></div><div class="row"><button class="btn secondary" onclick="speakCurrent()">🔊 發音</button><button class="btn" onclick="reveal()">顯示答案</button><button class="btn good" onclick="nextFlash()">下一個</button></div></div></section>
<section id="quiz" class="panel"><div class="card"><div class="stats" id="quizStats"></div><div class="word" id="quizQ"></div><div class="options" id="quizOptions"></div><div class="feedback" id="quizFeedback"></div><div class="center"><button class="btn" onclick="nextQuiz()">下一題</button></div></div></section>
<section id="spell" class="panel"><div class="card center"><div class="stats" id="spellStats"></div><div class="meaning" id="spellQ"></div><input id="spellInput" placeholder="輸入英文單字" autocomplete="off" style="max-width:420px"><div class="row" style="margin-top:12px"><button class="btn" onclick="checkSpell()">檢查</button><button class="btn secondary" onclick="showSpell()">看答案</button><button class="btn good" onclick="nextSpell()">下一題</button></div><div class="feedback" id="spellFeedback"></div></div></section>
<section id="list" class="panel"><div class="card"><input id="search" placeholder="搜尋英文或中文" oninput="renderList()"><p class="small" id="listCount"></p><div class="list" id="wordList"></div></div></section>
</div>
